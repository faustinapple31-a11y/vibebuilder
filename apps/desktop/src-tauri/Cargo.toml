[package]
name = "worldforge-desktop"
version = "0.1.0"
description = "WorldForge AI - describe your game, AI agents build a real Roblox project"
authors = ["WorldForge"]
edition = "2021"

[lib]
name = "worldforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "fs"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
sysinfo = "0.33"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
xcap = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
